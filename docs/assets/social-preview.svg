<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 1280 640">
<rect width="1280" height="640" fill="#101318"/>
<rect x="4" y="4" width="1272" height="632" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="72" y="150" font-family="Menlo, monospace" font-size="22" fill="#7ee787">IRON TRIANGLE PROTOCOL</text>
<text x="72" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" fill="#f0f6fc">Three imperfect models.</text>
<text x="72" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" fill="#f0f6fc">One durable paper trail.</text>
<text x="72" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Arbiter, executor, reviewer — bound by an append-only ledger,</text>
<text x="72" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">receipts, and pre-decided branches. Unverified "done" cannot ship.</text>
<rect x="72" y="470" width="238" height="64" rx="10" fill="#1d2026" stroke="#30363d"/>
<text x="92" y="497" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#e6edf3">ARBITER</text>
<text x="92" y="520" font-family="Menlo, monospace" font-size="14" fill="#8b949e">decides · &lt;2% tokens</text>
<rect x="330" y="470" width="238" height="64" rx="10" fill="#1d2026" stroke="#30363d"/>
<text x="350" y="497" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#e6edf3">EXECUTOR</text>
<text x="350" y="520" font-family="Menlo, monospace" font-size="14" fill="#8b949e">executes · &gt;90% tokens</text>
<rect x="588" y="470" width="238" height="64" rx="10" fill="#1d2026" stroke="#30363d"/>
<text x="608" y="497" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#e6edf3">REVIEWER</text>
<text x="608" y="520" font-family="Menlo, monospace" font-size="14" fill="#8b949e">reproduces receipts</text>
<rect x="856" y="72" width="380" height="330" rx="12" fill="#14161b" stroke="#30363d"/>
<text x="880" y="106" font-family="Menlo, monospace" font-size="14" fill="#8b949e">60-second quick start</text>
<text x="880" y="138" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#f0f6fc">demo@cleanroom iron-triangle % python3 -m un</text>
<text x="880" y="156" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#f0f6fc">ittest discover -s tests</text>
<text x="880" y="182" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#56d364">............................................</text>
<text x="880" y="200" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#56d364">......................</text>
<text x="880" y="226" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#56d364">OK</text>
<text x="880" y="270" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#f0f6fc">demo@cleanroom iron-triangle % python3 src/i</text>
<text x="880" y="288" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#f0f6fc">ron_triangle/sanitizer.py .</text>
<text x="880" y="314" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#56d364">sanitization scan passed: 0 hits across all </text>
<text x="880" y="332" xml:space="preserve" font-family="Menlo, monospace" font-size="14" fill="#56d364">rules</text>
<text x="72" y="596" font-family="Menlo, monospace" font-size="16" fill="#8b949e">protocol 1.0-draft · tool 0.3.2 · MIT · evidence: one four-day field run</text>
</svg>