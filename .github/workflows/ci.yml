name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Sanitization scan
        run: python src/iron_triangle/sanitizer.py .
      - name: Skill validation
        run: |
          python scripts/validate_skill.py skills/iron-triangle skills/codex/iron-triangle skills/claude/iron-triangle skills/kimi/iron-triangle skills/cursor/iron-triangle
      - name: Generated skills are up to date
        run: python scripts/build_skills.py --check

  fresh-contributor-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README 60-second quickstart (zero-install path)
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          python3 -m unittest discover -s tests
          cp examples/runtime-config.example.json "$HOME/my-runtime.json"
          python3 - "$HOME/my-runtime.json" <<'PY'
          import json, pathlib, sys, os
          p = pathlib.Path(sys.argv[1]); c = json.loads(p.read_text()); h = pathlib.Path(os.environ["HOME"])
          a = c["adapters"]["kimi-code"]
          a.update(base_url="http://session-api.invalid/api/v1", token_file=str(h / "my.token"), event_dir=str(h / "events"))
          (h / "events").mkdir(parents=True, exist_ok=True)
          a.update(default_executor_model="executor-model-a", default_executor_thinking="medium",
                   default_reviewer_model="reviewer-model-b", default_reviewer_thinking="medium")
          c["state_dir"] = str(h / "it-state")
          c["supervisor"]["path"] = str(h / "io.iron-triangle.bridge.plist")
          p.write_text(json.dumps(c, indent=2))
          PY
          python3 scripts/iron_triangle_bridge.py --config "$HOME/my-runtime.json" doctor
          python3 src/iron_triangle/sanitizer.py .
          python3 scripts/validate_skill.py skills/iron-triangle skills/codex/iron-triangle skills/claude/iron-triangle skills/kimi/iron-triangle skills/cursor/iron-triangle
          python3 scripts/build_skills.py --check
          END=$(date +%s)
          echo "fresh-contributor smoke wall time: $((END-START))s on $RUNNER_OS"
